{{- if .Values.tls.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "generic-mail.fullname" . }}
  labels:
    {{- include "generic-mail.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.tls.secretName }}
  issuerRef:
    name: {{ .Values.tls.issuer }}
    kind: ClusterIssuer
  dnsNames:
    {{- $imap := .Values.mailbox.imapHostname | default .Values.mailbox.hostname }}
    {{- $smtp := .Values.mailbox.smtpHostname | default .Values.mailbox.hostname }}
    {{- range list $imap $smtp | uniq }}
    - {{ . }}
    {{- end }}
{{- end }}
